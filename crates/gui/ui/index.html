<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>praews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="shell">
      <header class="masthead">
        <div class="identity">
          <h1 class="brand">praews</h1>
          <p class="tagline">portable local stack · zero system pollution</p>
        </div>
        <div class="power">
          <button id="btn-start" class="btn btn-go" type="button">Start</button>
          <button id="btn-stop" class="btn btn-halt" type="button">Stop</button>
        </div>
      </header>

      <p class="meta-line">
        <span id="lan">LAN —</span>
        <span class="dot" aria-hidden="true"></span>
        <span id="root">sandbox —</span>
      </p>

      <div class="board">
        <section class="pane pane-services" aria-labelledby="svc-title">
          <div class="pane-head">
            <h2 id="svc-title">Services</h2>
            <div class="php-switch">
              <label for="php-version">PHP</label>
              <select id="php-version">
                <option value="8.2">8.2</option>
                <option value="8.3" selected>8.3</option>
                <option value="8.4">8.4</option>
              </select>
              <button id="btn-switch-php" class="btn btn-ghost" type="button">Switch</button>
            </div>
          </div>
          <ul id="services" class="service-rail"></ul>
        </section>

        <section class="pane pane-sites" aria-labelledby="sites-title">
          <div class="pane-head">
            <h2 id="sites-title">Sites</h2>
          </div>
          <ul id="sites" class="site-list"></ul>
          <form id="site-form" class="site-form" autocomplete="off">
            <input id="site-domain" name="domain" placeholder="myapp.test" required />
            <input id="site-path" name="path" placeholder="/path/to/project" required />
            <button id="btn-add-site" class="btn btn-ghost" type="submit">Add</button>
          </form>
        </section>

        <section class="pane pane-mobile" aria-labelledby="mobile-title">
          <h2 id="mobile-title">Phone</h2>
          <p class="copy" id="dns-hint">—</p>
          <div class="link-stack">
            <a id="root-ca-link" href="#" target="_blank" rel="noreferrer">Install Root CA</a>
            <a id="mobile-link" href="#" target="_blank" rel="noreferrer">Open sslip.io link</a>
          </div>
        </section>
      </div>

      <section class="setup" aria-labelledby="setup-title">
        <div class="setup-row">
          <h2 id="setup-title">Setup</h2>
          <div class="setup-actions">
            <button id="btn-install-nginx" class="btn btn-chip" type="button">Nginx</button>
            <button id="btn-install-php" class="btn btn-chip" type="button">PHP</button>
            <button id="btn-install-mariadb" class="btn btn-chip" type="button">MariaDB</button>
            <button id="btn-verify" class="btn btn-chip" type="button">Verify</button>
            <button id="btn-trust-ca" class="btn btn-chip" type="button">Trust CA</button>
            <button id="btn-open-term" class="btn btn-chip" type="button">Terminal</button>
          </div>
        </div>
        <div class="status-bar" role="status" aria-live="polite">
          <div class="status-track"><div id="status-fill" class="status-fill"></div></div>
          <p id="progress">Ready.</p>
        </div>
      </section>

      <section class="pane pane-logs" aria-labelledby="logs-title">
        <div class="pane-head">
          <h2 id="logs-title">Logs</h2>
          <button id="btn-refresh-logs" class="btn btn-ghost" type="button">Refresh</button>
        </div>
        <pre id="logs" class="logs">(no logs yet)</pre>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
