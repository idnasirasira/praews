[package]
name = "gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "praews Tauri v2 GUI"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "praews-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core_engine = { path = "../core_engine" }
# `custom-protocol` makes `cargo run -p gui` load frontend/dist instead of
# http://localhost:1420 (which is only started by `cargo tauri dev`).
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
