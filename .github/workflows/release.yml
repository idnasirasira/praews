name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend deps
        run: npm ci
        working-directory: crates/gui/frontend

      - name: Build and release (macOS arm64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/gui
          tagName: ${{ github.ref_name }}
          releaseName: "praews ${{ github.ref_name }}"
          releaseBody: |
            Portable Nginx + PHP + MariaDB for macOS Apple Silicon.

            Download the `.dmg`, open it, and drag **praews** to Applications.
            In-app updates use the signed updater artifacts on this release.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin -b app dmg
