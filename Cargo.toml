[workspace]
resolver = "2"
members = [
    "crates/core_engine",
    "crates/gui",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["praews"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "fs", "net", "signal"] }
tera = "1.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
zip = "2.2"
flate2 = "1.0"
tar = "0.4"
hickory-server = "0.24"
hickory-proto = "0.24"
async-trait = "0.1"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
time = "0.3"
